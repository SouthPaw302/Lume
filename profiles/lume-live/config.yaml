model:
  default: openai/gpt-5.6-sol
  provider: custom
  base_url: http://127.0.0.1:12437/v1
  streaming: false
terminal:
  backend: local
  cwd: /home/koss/LumeAI
agent:
  disabled_toolsets: []
approvals:
  mode: auto
  deny:
    - "git push*"
    - "*camera*"
    - "*continuous*sensing*"
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  write_approval: false
skills:
  write_approval: false
  guard_agent_created: true
  auto_load:
    - lume-development
_config_version: 50
